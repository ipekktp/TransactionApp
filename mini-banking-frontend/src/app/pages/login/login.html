<div class="auth-page">

  <div class="auth-card">

    <div class="brand">
      <h1>MiniBank</h1>
      <p>Güvenli mini bankacılık sistemine giriş yap.</p>
    </div>

    <form (ngSubmit)="login()">

      <label>Kullanıcı Adı</label>
      <input
        type="text"
        name="username"
        [(ngModel)]="username"
        placeholder="Kullanıcı adını gir"
        required
      />

      <label>Şifre</label>
      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Şifreni gir"
        required
      />

      <button type="submit">
        Giriş Yap
      </button>

    </form>

    @if (errorMessage) {
      <div class="error-message">
        {{ errorMessage }}
      </div>
    }

    <a routerLink="/register" class="switch-link">
      Hesabın yok mu? Kayıt ol
    </a>

  </div>

</div>
